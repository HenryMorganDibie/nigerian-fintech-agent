services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: naija
      POSTGRES_PASSWORD: naija
      POSTGRES_DB: naijafinai
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naija -d naijafinai"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: { context: ./backend, dockerfile: Dockerfile }
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://naija:naija@postgres:5432/naijafinai
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  # Optional local LLM pool (docker compose --profile local-llm up). Pull models with
  #   docker compose exec ollama ollama pull llama3.2:3b
  # then set OLLAMA_BASE_URL=http://ollama:11434 and LLM_LOCAL_POOL=first|last|only.
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    volumes: [ollamadata:/root/.ollama]
    restart: unless-stopped

  frontend:
    build: { context: ./frontend, dockerfile: Dockerfile }
    ports: ["80:80"]
    depends_on: [backend]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  ollamadata:
